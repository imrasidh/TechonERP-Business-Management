name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  techon-erp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: erp-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full CI (must match local: npm run ci)
        run: npm run ci
